name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source gates + tests that don't need a simulator. macOS because swift-format, Tuist and the
  # HikkiCore tests need Xcode.
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install tools
        run: brew install --cask tuist
      - name: Install dependencies
        run: make bootstrap
      - name: Lint, format, design tokens, docs, web + core tests
        run: make test
      - name: Build macOS and iOS
        run: make build-mac build-ios

  ui:
    runs-on: macos-26
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: brew install --cask tuist && make bootstrap
      - name: iPhone UI tests
        run: make test-ui-ios UI_SIM="platform=iOS Simulator,name=iPhone 17 Pro"
